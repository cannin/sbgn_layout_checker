[project]
name = "sbgn-layout-checker"
version = "0.1.0"
description = "Check SBGN layouts for arc crossings and arc-node overlaps."
requires-python = ">=3.14"
dependencies = [
    "render-sbgn-py @ git+https://github.com/cannin/render_sbgn.git@f0b98cfc92ad1db353aaf4aa495e488740b88c1d#subdirectory=python",
]

[project.scripts]
sbgn-layout-checker-py = "sbgn_layout_checker.analyze_sbgn_layout:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.12.11",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["sbgn_layout_checker"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
